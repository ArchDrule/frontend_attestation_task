<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./assets/css/card.css" />
        <title>DUAL SENSE</title>
    </head>
    <body>
        <section class="section section_type_product">
            <div
                class="section__decor-circle section__decor-circle_position_1"
            ></div>
            <div
                class="section__decor-circle section__decor-circle_position_2"
            ></div>
            <div
                class="section__decor-circle section__decor-circle_position_3"
            ></div>
            <div
                class="section__decor-circle section__decor-circle_position_4"
            ></div>

            <div class="product">
                <div class="console-title-block">
                    <img
                        src="assets/images/png/gamepad.png"
                        alt="gamepad-image"
                        class="gamepad-image console-title-block__image"
                    />

                    <div class="console-title-block__texts">
                        <p
                            class="console-title-block__text console-title-block__text_opacity_80"
                        >
                            console
                        </p>
                        <p
                            class="console-title-block__text console-title-block__text_opacity_65"
                        >
                            console
                        </p>
                        <p
                            class="console-title-block__text console-title-block__text_opacity_45"
                        >
                            console
                        </p>
                        <p
                            class="console-title-block__text console-title-block__text_opacity_25"
                        >
                            console
                        </p>
                        <p
                            class="console-title-block__text console-title-block__text_opacity_10"
                        >
                            console
                        </p>
                    </div>
                </div>

                <div class="product__info">
                    <div class="product__content">
                        <div class="product-titles">
                            <h1 class="product__title">DUAL SENSE</h1>
                            <h2 class="product__subtitle">
                                Wireless Controller
                            </h2>
                        </div>

                        <p class="product__price">$100.00</p>

                        <div class="colors-container">
                            <p class="colors-container__color-title">Color:</p>

                            <input
                                type="radio"
                                name="color"
                                value="red"
                                checked
                                class="colors-container__color-radio colors-container__color-radio_color_red"
                                id="color-radio-red"
                            />
                            <input
                                type="radio"
                                name="color"
                                value="blue"
                                class="colors-container__color-radio colors-container__color-radio_color_blue"
                                id="color-radio-blue"
                            />
                            <input
                                type="radio"
                                name="color"
                                value="green"
                                class="colors-container__color-radio colors-container__color-radio_color_green"
                                id="color-radio-green"
                            />
                        </div>

                        <p class="product__description">
                            Plot a course for astronomical adventures on your
                            PS5 console with dual sense.<br />
                            Discover a deeper , highly immersive gaming
                            experience that brings the action to life in the
                            palms of your hand.
                        </p>

                        <div class="product__buttons">
                            <button class="button button_red">
                                <span class="button__text">Add to cart</span>
                            </button>

                            <button class="button button_with-icon">
                                <span class="button__text"
                                    >Add to wishlist</span
                                >
                                <img
                                    src="assets/images/svg/heart.svg"
                                    alt="heart"
                                    class="icon icon_type_heart"
                                />
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="section section_type_hollow"></section>
    </body>
</html>
